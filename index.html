<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dugout Lineup">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dugout Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F1F4F8;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#0F2440;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:#0F2440}
a{color:#1D4ED8;text-decoration:none}
a:hover{color:#14349B}
*:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(15,36,64,.22);border-radius:8px}
@keyframes pop{from{transform:scale(.82);opacity:.35}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#F1F4F8;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:#0F2440;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 10px 24px rgba(15,36,64,.42);will-change:transform}
#ghost[hidden]{display:none}
#boot-error{display:none;margin:0;padding:24px;font:13px/1.6 ui-monospace,monospace;color:#991B1B;background:#FEF2F2;white-space:pre-wrap}
@media print{
  html,body{height:auto;background:#fff}
  #app{position:static;height:auto;overflow:visible;display:block}
  .scroll{overflow:visible;height:auto;padding-bottom:0!important}
  .no-print{display:none!important}
  *,*::before,*::after{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important;backdrop-filter:none!important;box-shadow:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ghost" hidden></div>
<pre id="boot-error"></pre>
<script>
(function(){
'use strict';

/* ============================================================
   Dugout Lineup - youth baseball roster, lineup and game-day tool.
   Single file. No build step, no server, no network required.
   State is saved to this browser's localStorage.
   ============================================================ */

var LS = 'dugout-lineup-v3';

var POS  = ['P','C','1B','2B','3B','SS','LF','CF','RF'];
var INFP = ['P','C','1B','2B','3B','SS'];
var PCOL = {P:'#FECACA',C:'#FED7AA','1B':'#FEF3C7','2B':'#DCFCE7','3B':'#BFDBFE',SS:'#DDD6FE',LF:'#FBCFE8',CF:'#FBCFE8',RF:'#FBCFE8',REST:'#E2E8F0'};
var PTXT = {P:'#7F1D1D',C:'#7C2D12','1B':'#78350F','2B':'#14532D','3B':'#1E3A8A',SS:'#4C1D95',LF:'#831843',CF:'#831843',RF:'#831843',REST:'#334155'};
var SLOTX = {CF:50,LF:15,RF:85,SS:33,'2B':67,'3B':14,'1B':86,P:50,C:50};
var SLOTY = {CF:0.02,LF:0.075,RF:0.075,SS:0.315,'2B':0.315,'3B':0.515,'1B':0.515,P:0.645,C:0.845};
var AVAIL = ['Available','Absent','Arriving late','Leaving early','Injured','Batting only','Defense only','Selected innings'];
var OUT_STATES = {Absent:1, Injured:1};

/* Seed roster.
   [id, jersey, first, last, batting, pitching, fielding, positionInnings, ratings, trend]
   batting  [GP,PA,AB,H,2B,3B,HR,RBI,R,BB,SO,QAB,contactPct,hardHit,pitchesSeen]
   pitching [IP,BF,pitches,ERA,WHIP,strikePct,fpsPct,SO,BB,H,ER,WP]
   fielding [chances,A,PO,fpct,E]
   ratings  [contact,power,speed,infield,outfield,pitching,catching,awareness,devPriority] */
var SEED = [
  ['ritz',7,'Ritz','Everhart',[12,24,18,8,2,1,0,7,11,5,3,15,83.3,5,92],['4.1',22,78,4.15,1.62,58,52,6,6,5,2,2],[24,6,16,0.917,2],{CF:'22.0','2B':'8.0',SS:'6.0',P:'4.1',LF:'3.0'},[4,3,5,4,5,3,2,4,2],'up'],
  ['lucas',12,'Lucas','Fritzinger',[12,26,20,7,1,0,1,9,8,6,5,14,75.0,4,104],['6.0',30,112,3.00,1.33,61,55,9,5,7,2,1],[31,9,20,0.935,2],{C:'20.0','1B':'14.0',P:'6.0','3B':'2.0'},[4,4,3,4,3,4,5,4,2],'flat'],
  ['eli',3,'Eli','Maslennikov',[11,23,17,6,2,0,0,5,7,5,6,12,70.6,3,99],['8.1',38,141,2.16,1.08,64,59,13,4,5,2,0],[27,11,14,0.926,2],{P:'8.1','3B':'16.0','2B':'10.0',SS:'4.0'},[3,3,4,4,3,5,2,4,2],'up'],
  ['will',21,'Will','Kobetitsch',[12,42,33,12,3,1,1,14,13,7,7,24,78.8,9,168],null,[40,8,30,0.950,2],{'1B':'18.0',C:'16.0','3B':'6.0',LF:'2.0'},[4,5,3,4,3,2,4,4,2],'up'],
  ['jj',9,'JJ','Tucker',[12,28,22,9,2,1,0,8,10,5,4,17,77.3,6,115],['3.2',19,71,5.40,1.80,55,48,4,5,4,3,3],[35,15,18,0.943,2],{SS:'30.0','2B':'6.0',P:'3.2'},[4,3,4,5,3,3,2,5,2],'flat'],
  ['liam',5,'Liam','Daugila',[11,22,16,5,1,0,0,4,6,5,7,10,56.3,2,96],null,[18,6,9,0.833,3],{'2B':'20.0','1B':'8.0',RF:'4.0'},[2,2,3,3,3,2,2,3,4],'down'],
  ['depew',14,'William','Depew',[12,25,19,7,1,0,0,6,7,5,5,13,73.7,4,101],['7.2',34,126,2.61,1.30,62,57,10,5,5,2,1],[26,10,14,0.923,2],{'3B':'22.0',P:'7.2','1B':'4.0',LF:'2.0'},[3,3,3,4,3,4,2,4,3],'flat'],
  ['forrest',2,'Forrest','Tanner',[10,19,14,4,1,0,0,3,5,4,6,8,64.3,2,83],null,[12,2,8,0.833,2],{LF:'14.0',RF:'10.0',CF:'6.0'},[2,2,4,2,4,2,2,3,4],'up'],
  ['jesse',18,'','Jesse',null,null,null,null,[3,3,3,3,3,3,3,3,5],null],
  ['emory',24,'','Emory',null,null,null,null,[3,3,3,3,3,3,3,3,5],null],
  ['vince',11,'Vincenzo','McDuff',[12,36,28,11,3,1,1,13,12,6,2,26,92.9,8,140],['5.0',24,88,3.60,1.40,60,54,7,4,3,2,1],[33,12,19,0.939,2],{CF:'18.0',SS:'12.0','2B':'8.0',P:'5.0'},[5,4,4,4,4,4,3,5,1],'up']
];

/* The game sheet the app starts from. Key order is the batting order;
   each array is that player's position for innings 1-6.
   Changing this needs a new SEED_STAMP to reach devices that already
   have saved data - see boot(). */
var DEMO = {
  liam:   ['2B','2B','REST','P','2B','2B'],
  ritz:   ['1B','SS','SS','CF','CF','CF'],
  eli:    ['REST','P','3B','3B','3B','3B'],
  lucas:  ['P','1B','1B','1B','C','C'],
  will:   ['C','C','C','C','1B','1B'],
  depew:  ['3B','3B','CF','2B','REST','P'],
  forrest:['CF','CF','2B','REST','P','LF'],
  jj:     ['SS','REST','P','SS','SS','SS'],
  jesse:  ['LF','LF','RF','RF','LF','REST'],
  emory:  ['RF','RF','LF','LF','RF','RF']
};
var ACTIVE = Object.keys(DEMO);

/* Bump whenever DEMO or the default settings change, so a device holding an
   older sheet picks up the new one instead of booting the stale plan. */
var SEED_STAMP = '2026-08-30-eom';

/* No completed games this season yet. */
var RECENT_SEED = [];

/* ---------- number formatting ---------- */
function sd(a, b){ var v = a / b; return (b && isFinite(v)) ? v : null; }
function ipOuts(s){
  if(s === null || s === undefined || s === '') return null;
  var n = parseFloat(s);
  if(isNaN(n)) return null;
  var w = Math.floor(n + 1e-9);
  var f = Math.round((n - w) * 10);
  return w * 3 + Math.min(f, 2);
}
function ipDisp(o){ if(o === null || o === undefined) return '—'; return Math.floor(o / 3) + '.' + (o % 3); }
function f3(v){ if(v === null || v === undefined || isNaN(v)) return '—'; return (v < 1 && v >= 0) ? v.toFixed(3).slice(1) : v.toFixed(3); }
function p1(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : v.toFixed(1) + '%'; }
function f2(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : v.toFixed(2); }
function i0(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : String(Math.round(v)); }

/* ---------- player model ---------- */
function mkPlayer(r){
  var id = r[0], jersey = r[1], first = r[2], last = r[3];
  var B = r[4], P = r[5], F = r[6], PI = r[7], RT = r[8] || [3,3,3,3,3,3,3,3,3], trend = r[9];
  var display = (first && String(first).trim()) ? first + ' ' + last : String(last);
  var b = null;
  if(B){
    var GP = B[0], PA = B[1], AB = B[2], H = B[3], d2 = B[4], d3 = B[5], HR = B[6];
    var tb = (H - d2 - d3 - HR) + 2 * d2 + 3 * d3 + 4 * HR;
    var obp = sd(H + B[9], PA), slg = sd(tb, AB);
    b = {GP:GP, PA:PA, AB:AB, H:H, doubles:d2, triples:d3, HR:HR, RBI:B[7], runs:B[8], walks:B[9],
      strikeouts:B[10], QAB:B[11], AVG:sd(H, AB), OBP:obp, SLG:slg,
      OPS:(obp === null || slg === null) ? null : obp + slg,
      QABPercent:sd(100 * B[11], PA), contactPercent:B[12], hardHitBalls:B[13],
      pitchesSeen:B[14], pitchesPerPA:sd(B[14], PA)};
  }
  var p = null;
  if(P){
    var outs = ipOuts(P[0]), inn = outs === null ? null : outs / 3;
    p = {inningsPitchedDisplay:P[0], inningsPitchedOuts:outs, battersFaced:P[1], pitches:P[2],
      ERA:P[3], WHIP:P[4], strikePercent:P[5], firstPitchStrikePercent:P[6], strikeouts:P[7],
      walks:P[8], hitsAllowed:P[9], earnedRuns:P[10], wildPitches:P[11],
      walksPerInning:sd(P[8], inn), pitchesPerInning:sd(P[2], inn), kPerBF:sd(100 * P[7], P[1])};
  }
  var f = null;
  if(F){
    var pi = {}, tot = 0;
    Object.keys(PI || {}).forEach(function(k){ var o = ipOuts(PI[k]); pi[k] = o; tot += (o || 0); });
    f = {totalChances:F[0], assists:F[1], putouts:F[2], fieldingPercent:F[3], errors:F[4],
      positionInnings:pi, positionDisplay:PI || {}, totalDefensiveOuts:tot};
  }
  var rk = ['contact','power','speed','infield','outfield','pitching','catching','awareness','dev'];
  var ratings = {};
  rk.forEach(function(k, i){ ratings[k] = (RT[i] === undefined || RT[i] === null) ? 3 : RT[i]; });
  return {id:id, jerseyNumber:jersey, firstName:first, lastName:last, displayName:display,
    isNewPlayer:!B && !P && !F, b:b, p:p, f:f, ratings:ratings, trend:trend};
}

function buildPlan(n, ids){
  var out = [];
  for(var i = 0; i < n; i++){
    var m = {};
    ids.forEach(function(id){ if(DEMO[id]) m[id] = DEMO[id][i] || null; });
    out.push(m);
  }
  return out;
}
function blankPlan(n){
  var out = [];
  for(var i = 0; i < n; i++) out.push({});
  return out;
}

/* ---------- html escaping ---------- */
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function e(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){ return ESC[c]; });
}

/* ============================================================
   STORE
   ============================================================ */

var App = {
  state:null,
  roster:[],
  byId:{},
  rosterRows:null,   // non-null once a CSV has been imported
  canStore:true,     // false in private windows / when site data is blocked
  warnStorage:false, // only true once a real save has actually failed
  toastTimer:null,
  flashTimer:null
};

/* Private windows and blocked site data make localStorage throw. Find out up
   front so the app can say so, rather than quietly losing a coach's lineup. */
function storageWorks(){
  try{
    var k = LS + ':probe';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  }catch(err){ return false; }
}

function setRoster(rows){
  App.roster = rows.map(mkPlayer);
  App.byId = {};
  App.roster.forEach(function(p){ App.byId[p.id] = p; });
}
function isSeedRoster(){ return !App.rosterRows; }

function boot(savedOverride){
  var saved = null;
  App.canStore = storageWorks();
  if(savedOverride){
    saved = savedOverride;
  } else {
    try{
      var raw = localStorage.getItem(LS);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.v === 3 && s.d) saved = s.d;
      }
    }catch(err){}
  }

  App.rosterRows = (saved && saved.rosterRows) ? saved.rosterRows : null;
  setRoster(App.rosterRows || SEED);

  var seedMode = isSeedRoster();
  var ids = App.roster.map(function(p){ return p.id; });
  var avail = {};
  App.roster.forEach(function(p){
    avail[p.id] = (seedMode && p.id === 'vince') ? 'Absent' : 'Available';
  });

  var base = {
    screen:'games', tab:'defense', inning:1, view:'field', gridMode:'player',
    plan: seedMode ? buildPlan(6, ids) : blankPlan(6),
    locks:{}, order: seedMode ? ACTIVE.slice() : ids.slice(), bLocks:{},
    avail:avail, innWindow:{}, restrict:{}, overrides:{}, notes:{},
    settings:{opponent:'EOM Angels 9U', date:'2026-08-30', time:'1:45 PM',
      field:'1500 Pattison Ave', innings:6, fielders:9,
      battingMode:'Whole roster', lineupMode:'Balanced'},
    seedStamp:SEED_STAMP,
    batMetrics:['AVG','OBP'], compare:false, versions:[],
    rankGroup:'BATTING', rankMetric:'AVG', rankFilter:'Available today', minPA:0, rankPos:'SS',
    gd:{inning:1, actual:{}, log:[]}, finalized:false,
    hist:[], fut:[], sheet:null, sheetTab:'OVERVIEW', sheetMore:false,
    modal:null, toast:'', sel:null, drag:null, over:null, lastMove:null,
    csvNote:'', csvSource:'', recent:RECENT_SEED.slice(),
    showPositionColors:true, showDevelopmentFlags:true,
    rosterRows:null
  };
  /* A new built-in game sheet has to reach devices that already hold saved
     data, which would otherwise keep booting the old plan. Drop only the keys
     the sheet defines and let the defaults above fill them back in; coach
     notes, eligibility overrides, restrictions and saved versions are kept.
     Skipped once a CSV roster is imported - the sheet's player ids no longer
     apply, and that roster's plan is the coach's own. */
  if(saved && !App.rosterRows && saved.seedStamp !== SEED_STAMP){
    ['plan','order','avail','settings','locks','bLocks','innWindow','gd',
     'finalized','recent','inning'].forEach(function(k){ delete saved[k]; });
    App.sheetUpdated = true;
  }

  if(saved) Object.assign(base, saved);
  base.seedStamp = SEED_STAMP;
  base.hist = []; base.fut = [];
  base.sheet = null; base.modal = null; base.toast = '';
  base.sel = null; base.drag = null; base.over = null; base.lastMove = null;
  return base;
}

var PERSIST_KEYS = ['plan','locks','order','bLocks','avail','innWindow','restrict','overrides','notes',
  'settings','batMetrics','versions','gd','finalized','rankGroup','rankMetric','rankFilter','minPA',
  'rankPos','screen','tab','inning','view','gridMode','csvNote','csvSource','recent',
  'showPositionColors','showDevelopmentFlags','rosterRows','seedStamp'];

function persist(){
  var S = App.state, d = {};
  PERSIST_KEYS.forEach(function(k){ d[k] = S[k]; });
  d.rosterRows = App.rosterRows;
  try{
    localStorage.setItem(LS, JSON.stringify({v:3, d:d}));
    App.canStore = true;
    App.warnStorage = false;
  }catch(err){
    /* Blocked, or out of quota. Only warn once a real save has failed - saying
       so on a clean first load would be noise, and would show up in previews. */
    App.canStore = false;
    App.warnStorage = true;
  }
}

function up(patch){
  Object.assign(App.state, patch);
  persist();
  render();
}

function say(msg){
  if(App.toastTimer) clearTimeout(App.toastTimer);
  App.state.toast = msg;
  App.toastTimer = setTimeout(function(){ App.state.toast = ''; render(); }, 2200);
  render();
}

function snap(){
  var S = App.state;
  return JSON.stringify({plan:S.plan, locks:S.locks, order:S.order, bLocks:S.bLocks,
    gd:S.gd, settings:S.settings, avail:S.avail});
}

/* Apply a change, recording it on the undo stack. */
function mut(fn, msg){
  var before = snap();
  var n = fn(App.state) || {};
  n.hist = App.state.hist.concat([before]).slice(-50);
  n.fut = [];
  Object.assign(App.state, n);
  persist();
  if(App.state.lastMove){
    if(App.flashTimer) clearTimeout(App.flashTimer);
    App.flashTimer = setTimeout(function(){ App.state.lastMove = null; render(); }, 400);
  }
  if(msg) say(msg); else render();
}

function undo(){
  if(!App.state.hist.length){ say('Nothing to undo'); return; }
  var before = snap();
  var prev = JSON.parse(App.state.hist[App.state.hist.length - 1]);
  var hist = App.state.hist.slice(0, -1);
  var fut = App.state.fut.concat([before]);
  Object.assign(App.state, prev, {hist:hist, fut:fut, sel:null, lastMove:null});
  persist();
  say('Undo');
}
function redo(){
  if(!App.state.fut.length){ say('Nothing to redo'); return; }
  var before = snap();
  var nx = JSON.parse(App.state.fut[App.state.fut.length - 1]);
  var fut = App.state.fut.slice(0, -1);
  var hist = App.state.hist.concat([before]);
  Object.assign(App.state, nx, {hist:hist, fut:fut, sel:null, lastMove:null});
  persist();
  say('Redo');
}

/* ============================================================
   DERIVED STATE
   ============================================================ */

function wide(){ return window.innerWidth >= 768; }

function inGame(id){ return !OUT_STATES[App.state.avail[id]]; }
function bats(id){ return inGame(id) && App.state.avail[id] !== 'Defense only'; }
function fields(id){ return inGame(id) && App.state.avail[id] !== 'Batting only'; }
function innOk(id, inning){
  var w = App.state.innWindow[id];
  if(!w || !w.length) return true;
  return w.indexOf(inning) >= 0;
}
function fieldersFor(inning){
  return App.roster.filter(function(p){ return fields(p.id) && innOk(p.id, inning); })
    .map(function(p){ return p.id; });
}
function gameIds(){ return App.state.order.filter(inGame); }
function locked(inning, id){ return !!App.state.locks[inning + ':' + id]; }
function posOf(inning, id){ var m = App.state.plan[inning - 1]; return m ? m[id] : null; }
function playerAt(inning, pos){
  var m = App.state.plan[inning - 1] || {};
  var k = Object.keys(m).find(function(id){ return m[id] === pos && inGame(id); });
  return k || null;
}
function short(id){
  var p = App.byId[id];
  if(!p) return '';
  if(!p.firstName) return p.displayName;
  return p.firstName + ' ' + String(p.lastName).charAt(0) + '.';
}
function chipName(id){
  var p = App.byId[id];
  if(!p) return '';
  return p.firstName ? p.firstName : p.displayName;
}
function expOuts(id, pos){
  var p = App.byId[id];
  if(!p || !p.f) return null;
  var v = p.f.positionInnings[pos];
  return v === undefined ? 0 : v;
}
function expStatus(id, pos){
  var p = App.byId[id];
  if(!p) return 'Unknown';
  var ov = (App.state.overrides[id] || {})[pos];
  if(ov === 'no') return 'Not eligible';
  if(ov === 'yes') return 'Coach approved';
  if(p.isNewPlayer) return 'Unknown';
  var o = expOuts(id, pos) || 0;
  if(o >= 30) return 'Experienced';
  if(o >= 9) return 'Some experience';
  return 'New position';
}
function eligible(id, pos){
  var ov = (App.state.overrides[id] || {})[pos];
  if(ov === 'no') return false;
  var r = App.state.restrict[id] || {};
  if(pos === 'P' && r.noPitch) return false;
  if(pos === 'C' && r.noCatch) return false;
  return true;
}
function expScore(id, pos){
  var p = App.byId[id];
  if(!p) return -99;
  if(!eligible(id, pos)) return -999;
  var r = p.ratings, base;
  if(pos === 'P') base = r.pitching * 4;
  else if(pos === 'C') base = r.catching * 4;
  else if(INFP.indexOf(pos) >= 0) base = r.infield * 3;
  else base = r.outfield * 3;
  var o = expOuts(id, pos);
  return base + (o === null ? 4 : Math.min(o / 3, 14));
}
function countInPlan(plan, id, pos, n){
  var c = 0;
  for(var i = 0; i < n; i++){ var m = plan[i] || {}; if(m[id] === pos) c++; }
  return c;
}
function col(p){ return App.state.showPositionColors === false ? '#E8ECF2' : (PCOL[p] || '#E2E8F0'); }

/* The batting order, restricted to players who actually bat.
   Each entry keeps its index in state.order so locks and moves stay consistent. */
function battingSlots(){
  var out = [];
  App.state.order.forEach(function(id, oi){ if(bats(id)) out.push({id:id, oi:oi}); });

}

/* ---------- validation ---------- */
function audit(){
  var S = App.state, N = S.settings.innings;
  var ids = gameIds().filter(fields);
  var red = [], amber = [], blue = [], gray = [];
  var rest = {}, def = {}, inf = {}, of = {}, pit = {}, cat = {}, variety = {};
  var filled = 0;
  ids.forEach(function(id){
    rest[id] = 0; def[id] = 0; inf[id] = 0; of[id] = 0; pit[id] = 0; cat[id] = 0; variety[id] = {};
  });
  for(var i = 1; i <= N; i++){
    (function(i){
      var m = S.plan[i - 1] || {};
      var seen = {};
      var elig = fieldersFor(i);
      elig.forEach(function(id){
        var p = m[id];
        if(!p){
          red.push({t:'Inning ' + i + ': ' + short(id) + ' has no assignment',
            d:'Every active player needs a position or a rest each inning.'});
          return;
        }
        if(p === 'REST'){
          rest[id] = (rest[id] || 0) + 1;
          var prev = (S.plan[i - 2] || {})[id];
          if(prev === 'REST') amber.push({t:'Inning ' + i + ': ' + short(id) + ' rests back-to-back',
            d:'Consecutive rest innings - spread rests apart when you can.'});
          return;
        }
        if(seen[p]){
          red.push({t:'Inning ' + i + ': two players at ' + p,
            d:short(seen[p]) + ' and ' + short(id) + ' are both assigned ' + p + '.'});
        } else { seen[p] = id; filled++; }
        def[id] = (def[id] || 0) + 1;
        if(INFP.indexOf(p) >= 0) inf[id] = (inf[id] || 0) + 1; else of[id] = (of[id] || 0) + 1;
        if(p === 'P') pit[id] = (pit[id] || 0) + 1;
        if(p === 'C') cat[id] = (cat[id] || 0) + 1;
        variety[id][p] = 1;
        var r = S.restrict[id] || {};
        if(p === 'P' && r.noPitch) red.push({t:'Inning ' + i + ': ' + short(id) + ' cannot pitch today',
          d:'Throwing restriction is set on this player.'});
        if(p === 'C' && r.noCatch) red.push({t:'Inning ' + i + ': ' + short(id) + ' cannot catch today',
          d:'Catching restriction is set on this player.'});
        if((S.overrides[id] || {})[p] === 'no'){
          red.push({t:'Inning ' + i + ': ' + short(id) + ' marked not eligible at ' + p,
            d:'Coach override blocks this position.'});
        } else if(expStatus(id, p) === 'New position'){
          blue.push({t:'Inning ' + i + ': ' + short(id) + ' is new to ' + p,
            d:'No recorded innings at ' + p + '. Good development rep - worth a heads-up before the pitch.'});
        } else if(expStatus(id, p) === 'Unknown'){
          blue.push({t:'Inning ' + i + ': ' + short(id) + ' has no history at ' + p,
            d:'New player - add a coach rating or eligibility so future plans are smarter.'});
        }
      });
      Object.keys(m).forEach(function(id){
        if(m[id] && m[id] !== 'REST' && !inGame(id)){
          red.push({t:'Inning ' + i + ': ' + short(id) + ' is ' + (S.avail[id] || 'unavailable').toLowerCase(),
            d:'Unavailable players cannot hold a position.'});
        }
        if(m[id] && m[id] !== 'REST' && !innOk(id, i)){
          red.push({t:'Inning ' + i + ': ' + short(id) + ' is not on the field that inning',
            d:'Arriving-late / leaving-early window excludes inning ' + i + '.'});
        }
      });
      POS.forEach(function(p){
        if(!seen[p] && elig.length >= 9){
          red.push({t:'Inning ' + i + ': ' + p + ' is empty', d:'No player is assigned to ' + p + '.'});
        }
      });
    })(i);
  }
  var totalRest = Object.keys(rest).reduce(function(a, k){ return a + rest[k]; }, 0);
  var noRest = ids.filter(function(id){ return !rest[id]; });
  var consec = 0;
  ids.forEach(function(id){
    for(var i = 2; i <= N; i++){
      if((S.plan[i - 1] || {})[id] === 'REST' && (S.plan[i - 2] || {})[id] === 'REST') consec++;
    }
  });
  ids.forEach(function(id){
    var vs = Object.keys(variety[id]).length;
    if(def[id] > 0 && vs === 1 && def[id] >= 4) amber.push({t:short(id) + ' plays ' + Object.keys(variety[id])[0] + ' all ' + def[id] + ' innings', d:'Single-position game. Consider one inning somewhere new.'});
    if(def[id] > 0 && !inf[id]) amber.push({t:short(id) + ' has no infield inning', d:'All ' + def[id] + ' defensive innings are in the outfield.'});
    if(def[id] > 0 && !of[id] && vs <= 2) blue.push({t:short(id) + ' never leaves the infield', d:'Fine for a competitive plan - flag it if you are developing outfield reads.'});
    if(cat[id] >= 4) amber.push({t:short(id) + ' catches ' + cat[id] + ' innings', d:'Heavy catching load in one game. Watch legs and heat.'});
    if(pit[id] >= 3) amber.push({t:short(id) + ' pitches ' + pit[id] + ' innings', d:'Arm workload - check your league rest rules before finalizing.'});
    if(def[id] <= N - 3) amber.push({t:short(id) + ' gets only ' + def[id] + ' defensive innings', d:'Below the rest of the group. Balance across the next game if this is intentional.'});
    if(App.byId[id] && App.byId[id].ratings.dev >= 5 && vs < 2) blue.push({t:short(id) + ' is a development priority', d:'Only ' + vs + ' position this game. Try one new spot in a low-pressure inning.'});
  });
  gray.push({t:totalRest + ' total rest assignments across ' + N + ' innings',
    d:ids.length + ' available fielders and ' + N + ' innings gives ' + (ids.length * N - N * 9) + ' rest slots. With ' + ids.length + ' players it is not possible for everyone to sit exactly once.'});
  if(noRest.length) gray.push({t:noRest.length + ' players do not rest',
    d:noRest.map(short).join(', ') + '. They play every inning of the plan.'});
  var pitchers = ids.filter(function(id){ return pit[id] > 0; }).map(short);
  if(pitchers.length) gray.push({t:'Pitchers used: ' + pitchers.join(', '),
    d:'All are eligible under the restrictions set on the availability screen.'});
  var restVals = ids.map(function(id){ return rest[id] || 0; });
  var spread = Math.max.apply(null, restVals.concat([0])) - Math.min.apply(null, restVals.concat([0]));
  return {red:red, amber:amber, blue:blue, gray:gray, rest:rest, def:def, inf:inf, of:of, pit:pit,
    cat:cat, variety:variety, ids:ids, filled:filled, need:N * 9, totalRest:totalRest,
    noRest:noRest, consec:consec, spread:spread};
}

function health(a){
  var N = App.state.settings.innings;
  var pct = a.need ? Math.round(100 * a.filled / a.need) : 0;
  var maxPit = Math.max.apply(null, a.ids.map(function(id){ return a.pit[id] || 0; }).concat([0]));
  var maxCat = Math.max.apply(null, a.ids.map(function(id){ return a.cat[id] || 0; }).concat([0]));
  var noInf = a.ids.filter(function(id){ return a.def[id] > 0 && !a.inf[id]; }).length;
  var single = a.ids.filter(function(id){ return Object.keys(a.variety[id]).length === 1 && a.def[id] >= 4; }).length;
  var rows = [
    {k:'Assignments', v:pct + '%', ok:pct === 100 ? 2 : (pct >= 90 ? 1 : 0),
      why:a.filled + ' of ' + a.need + ' defensive slots filled across ' + N + ' innings.'},
    {k:'Rules', v:a.red.length ? a.red.length + ' conflict' + (a.red.length > 1 ? 's' : '') : 'Complete', ok:a.red.length ? 0 : 2,
      why:a.red.length ? 'Fix red items on this screen before you finalize.' : 'No duplicate players, no duplicate positions, no unavailable players assigned, restrictions respected.'},
    {k:'Rest distribution', v:a.consec ? 'Review' : (a.spread <= 1 ? 'Good' : 'Uneven'), ok:a.consec ? 1 : (a.spread <= 1 ? 2 : 1),
      why:a.totalRest + ' rest assignments, ' + a.noRest.length + ' players never sit, ' + a.consec + ' back-to-back rests. Spread between most and fewest rests is ' + a.spread + '.'},
    {k:'Position variety', v:single ? 'Needs review' : 'Good', ok:single ? 1 : 2,
      why:single ? single + ' player(s) stay at one position for 4+ innings.' : 'Every player who plays 4+ innings sees more than one position.'},
    {k:'Arm workload', v:maxPit >= 3 ? 'Watch' : 'Good', ok:maxPit >= 3 ? 1 : 2,
      why:'Most innings by one pitcher: ' + maxPit + '. Most innings by one catcher: ' + maxCat + '.'},
    {k:'Defensive balance', v:noInf ? noInf + ' outfield-only' : 'Good', ok:noInf ? 1 : 2,
      why:noInf ? noInf + ' player(s) get no infield inning in this plan.' : 'Every fielder gets at least one infield and the outfield is covered.'}
  ];
  return {rows:rows, pct:pct};
}

function playTime(a){
  var out = {};
  a.ids.forEach(function(id){
    out[id] = {def:a.def[id] || 0, rest:a.rest[id] || 0, inf:a.inf[id] || 0, of:a.of[id] || 0,
      cat:a.cat[id] || 0, pit:a.pit[id] || 0, variety:Object.keys(a.variety[id]).length};
  });
  return out;
}

function rankData(a){
  var S = App.state;
  var list = metrics(S.rankGroup, a);
  var m = list.find(function(x){ return x.k === S.rankMetric; }) || list[0];
  var pool = App.roster.slice();
  var fl = S.rankFilter;
  if(fl === 'Available today') pool = pool.filter(function(p){ return inGame(p.id); });
  else if(fl === 'Eligible pitchers') pool = pool.filter(function(p){ return eligible(p.id, 'P') && (p.isNewPlayer || p.ratings.pitching >= 3); });
  else if(fl === 'Eligible catchers') pool = pool.filter(function(p){ return eligible(p.id, 'C') && (p.isNewPlayer || p.ratings.catching >= 3); });
  else if(fl === 'Eligible at ' + S.rankPos) pool = pool.filter(function(p){ return eligible(p.id, S.rankPos); });
  else if(fl === 'Returning players') pool = pool.filter(function(p){ return !p.isNewPlayer; });
  else if(fl === 'New players') pool = pool.filter(function(p){ return p.isNewPlayer; });
  if(S.minPA > 0) pool = pool.filter(function(p){ return p.isNewPlayer || (p.b && p.b.PA >= S.minPA); });
  var scored = pool.map(function(p){ return {p:p, v:m.get(p)}; });
  var ok = function(x){ return x.v !== null && x.v !== undefined && !isNaN(x.v); };
  var ranked = scored.filter(ok);
  var unranked = scored.filter(function(x){ return !ok(x); });
  ranked.sort(function(x, y){ return m.dir === 'asc' ? x.v - y.v : y.v - x.v; });
  return {metric:m, list:list, ranked:ranked, unranked:unranked};
}

   ACTIONS

function assign(inning, id, pos){
  if(locked(inning, id)){ say('Locked - unlock to move ' + short(id)); return; }
  var other = pos === 'REST' ? null : playerAt(inning, pos);
  if(other && locked(inning, other)){ say(short(other) + ' is locked at ' + pos); return; }
  var msg = other ? (short(id) + ' <-> ' + short(other)) : (short(id) + ' -> ' + (pos === 'REST' ? 'Rest' : pos));
  mut(function(s){
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    var m = plan[inning - 1];
    var cur = m[id] || 'REST';
    if(other) m[other] = cur;
    m[id] = pos;
    return {plan:plan, sel:null, lastMove:{inning:inning, ids:other ? [id, other] : [id]}};
  }, msg);
}

function swapOrderIdx(a, b){
  if(a < 0 || b < 0 || a === b) return;
  mut(function(s){
    var order = s.order.slice();
    var t = order[a]; order[a] = order[b]; order[b] = t;
    return {order:order, sel:null};
  }, 'Swapped batting spots');
}

function moveOrder(from, to){
  if(from === to || from < 0 || to < 0) return;
  mut(function(s){
    var order = s.order.slice();
    var it = order.splice(from, 1)[0];
    order.splice(to, 0, it);
    return {order:order, sel:null};
  }, 'Moved in the batting order');
}

function toggleLock(inning, id){
  var k = inning + ':' + id;
  var was = !!App.state.locks[k];
  mut(function(s){
    var locks = Object.assign({}, s.locks);
    if(locks[k]) delete locks[k]; else locks[k] = true;
    return {locks:locks};
  }, was ? 'Unlocked' : 'Locked ' + short(id) + ' - inning ' + inning);
}

function lockAllInnings(id){
  var pos = posOf(App.state.inning, id);
  if(!pos){ say('Assign ' + short(id) + ' a position first'); return; }
  var n = App.state.settings.innings;
  mut(function(s){
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    var locks = Object.assign({}, s.locks);
    for(var i = 1; i <= n; i++){
      var mm = plan[i - 1];
      var taken = Object.keys(mm).find(function(k){ return k !== id && mm[k] === pos; });
      if(pos !== 'REST' && taken && !locks[i + ':' + taken]) mm[taken] = mm[id] || 'REST';
      mm[id] = pos;
      locks[i + ':' + id] = true;
    }
    return {plan:plan, locks:locks};
  }, short(id) + ' locked at ' + pos + ' for all innings');
}

function copyInning(from, to){
  if(from < 1 || from > App.state.settings.innings){ say('No inning ' + from + ' to copy'); return; }
  mut(function(s){
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    var src = plan[from - 1];
    Object.keys(src).forEach(function(id){
      if(s.locks[to + ':' + id]) return;
      plan[to - 1][id] = src[id];
    });
    return {plan:plan, lastMove:{inning:to, ids:Object.keys(src)}};
  }, 'Copied inning ' + from + ' -> inning ' + to);
}

function clearInning(inning){
  mut(function(s){
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    Object.keys(plan[inning - 1]).forEach(function(id){
      if(!s.locks[inning + ':' + id]) plan[inning - 1][id] = null;
    });
    return {plan:plan};
  }, 'Cleared inning ' + inning);
}

/* Greedy assignment: fill each open position with the best available player,
   penalising repeats at that position and favouring anyone who has rested a lot. */
function fill(inning, onlyEmpty, quiet){
  var ids = fieldersFor(inning);
  var apply = function(s){
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    var m = plan[inning - 1];
    var keep = {};
    ids.forEach(function(id){
      if(s.locks[inning + ':' + id] || (onlyEmpty && m[id])) keep[id] = m[id];
    });
    var taken = {};
    Object.keys(keep).forEach(function(id){ if(keep[id] && keep[id] !== 'REST') taken[keep[id]] = 1; });
    var restSoFar = {};
    ids.forEach(function(id){ restSoFar[id] = countInPlan(s.plan, id, 'REST', s.settings.innings); });
    var free = POS.filter(function(p){ return !taken[p]; });
    free.forEach(function(pos){
      var best = null, bs = -1e9;
      ids.forEach(function(id){
        if(keep[id] !== undefined && keep[id] !== null) return;
        var sc = expScore(id, pos) - 2.5 * countInPlan(s.plan, id, pos, s.settings.innings) + 4 * restSoFar[id];
        if(sc > bs){ bs = sc; best = id; }
      });
      if(best && bs > -500) keep[best] = pos;
    });
    ids.forEach(function(id){ m[id] = keep[id] || 'REST'; });
    App.roster.forEach(function(p){ if(ids.indexOf(p.id) < 0) delete m[p.id]; });
    return {plan:plan, lastMove:{inning:inning, ids:ids}};
  };
  if(quiet){
    var n = apply(App.state);
    Object.assign(App.state, n);
    return;
  }
  mut(apply, onlyEmpty ? 'Auto-filled empty positions' : 'Regenerated unlocked assignments');
}

function fillAll(){
  var n = App.state.settings.innings;
  var before = snap();
  for(var i = 1; i <= n; i++) fill(i, false, true);
  App.state.hist = App.state.hist.concat([before]).slice(-50);
  App.state.fut = [];
  persist();
  say('Generated all ' + n + ' innings');
}

function setInnings(n){
  var v = Math.max(1, Math.min(9, n));
  mut(function(s){
    var plan = s.plan.slice();
    while(plan.length < v) plan.push(Object.assign({}, plan[plan.length - 1] || {}));
    var st = Object.assign({}, s.settings, {innings:v});
    return {plan:plan, settings:st, inning:Math.min(s.inning, v),
      gd:Object.assign({}, s.gd, {inning:Math.min(s.gd.inning, v)})};
  }, v + ' innings');
}

/* ---------- batting order ---------- */
function genOrder(mode){
  var ids = gameIds().filter(bats);
  function score(id){
    var p = App.byId[id], r = p.ratings;
    if(!p.b){
      if(mode === 'Development') return 1.05;
      if(mode === 'Competitive') return 0.35;
      return 0.72;
    }
    var base = p.b.OPS === null ? 0.5 : p.b.OPS;
    if(mode === 'Development') return base * 0.4 + (r.dev / 5) * 0.7 + (p.b.PA < 22 ? 0.25 : 0);
    if(mode === 'Competitive') return base + (r.awareness / 25);
    return base * 0.75 + (r.contact / 20) + (r.speed / 40);
  }
  return ids.slice().sort(function(a, b){ return score(b) - score(a); });
}

/* Regenerate the order, holding locked spots and any non-batting player in place. */
function applyOrder(mode){
  var gen = genOrder(mode);
  mut(function(s){
    var fixed = {}, fixedIds = {};
    s.order.forEach(function(id, i){
      if(s.bLocks[i] || !bats(id)){ fixed[i] = id; fixedIds[id] = 1; }
    });
    var pool = gen.filter(function(id){ return !fixedIds[id]; });
    var out = [], pi = 0;
    for(var i = 0; i < s.order.length; i++){
      if(fixed[i] !== undefined) out.push(fixed[i]);
      else if(pi < pool.length) out.push(pool[pi++]);
    }
    while(pi < pool.length) out.push(pool[pi++]);
    return {order:out.filter(Boolean), compare:false};
  }, mode + ' order applied (locks kept)');
}

function rotateOrder(){
  mut(function(s){
    var o = s.order.slice();
    o.push(o.shift());
    return {order:o};
  }, 'Rotated - leadoff moves to the bottom');
}

function toggleBLock(i){
  var was = !!App.state.bLocks[i];
  mut(function(s){
    var b = Object.assign({}, s.bLocks);
    if(b[i]) delete b[i]; else b[i] = true;
    return {bLocks:b};
  }, was ? 'Spot unlocked' : 'Spot locked');
}

function saveVersion(){

    var v = s.versions.concat([{name:s.settings.lineupMode + ' v' + (s.versions.length + 1),

/* ---------- availability ---------- */
function setAvail(id, v){
  mut(function(s){
    var a = Object.assign({}, s.avail); a[id] = v;
    var plan = s.plan.map(function(o){ return Object.assign({}, o); });
    var order = s.order.slice();
    if(OUT_STATES[v]){
      plan.forEach(function(m){ delete m[id]; });
      order = order.filter(function(x){ return x !== id; });
    } else if(order.indexOf(id) < 0){
      order = order.concat([id]);
    }
    return {avail:a, plan:plan, order:order};

}

function toggleWindow(id, inning){

    cur.sort(function(x, y){ return x - y; });

function toggleRestrict(id, key){

/* ---------- game day ---------- */
function actualOf(inning, id){

  if(a && a[id] !== undefined) return a[id];
  return posOf(inning, id);
}
function actualPlayerAt(inning, pos){
  var m = App.state.gd.actual[inning] || App.state.plan[inning - 1] || {};
  var k = Object.keys(m).find(function(id){ return m[id] === pos && inGame(id); });
  return k || null;
}
function confirmActual(inning){
  mut(function(s){
    var gd = {inning:s.gd.inning, actual:Object.assign({}, s.gd.actual), log:s.gd.log.slice()};
    gd.actual[inning] = Object.assign({}, s.plan[inning - 1]);
    gd.log = gd.log.concat(['Inning ' + inning + ' actual positions confirmed']);
    return {gd:gd};
  }, 'Inning ' + inning + ' recorded as played');
}
function advanceInning(){
  var S = App.state;
  if(S.gd.inning >= S.settings.innings){ say('Last inning - use End game'); return; }
  mut(function(s){
    var gd = {inning:s.gd.inning + 1, actual:Object.assign({}, s.gd.actual), log:s.gd.log.slice()};
    if(!gd.actual[s.gd.inning]) gd.actual[s.gd.inning] = Object.assign({}, s.plan[s.gd.inning - 1]);
    gd.log = gd.log.concat(['Advanced to inning ' + gd.inning]);
    return {gd:gd, inning:gd.inning};
  }, 'Now in inning ' + (S.gd.inning + 1));
}
function gdSwap(a, b, futureToo){
  var inn = App.state.gd.inning;
  mut(function(s){
    var gd = {inning:s.gd.inning, actual:Object.assign({}, s.gd.actual), log:s.gd.log.slice()};
    var cur = Object.assign({}, gd.actual[inn] || s.plan[inn - 1]);
    var t = cur[a]; cur[a] = cur[b]; cur[b] = t;
    gd.actual[inn] = cur;
    var plan = s.plan;
    if(futureToo){
      plan = s.plan.map(function(o, i){
        if(i + 1 <= inn) return Object.assign({}, o);
        var m = Object.assign({}, o);
        if(s.locks[(i + 1) + ':' + a] || s.locks[(i + 1) + ':' + b]) return m;
        var x = m[a]; m[a] = m[b]; m[b] = x;
        return m;
      });
      gd.log = gd.log.concat(['Inning ' + inn + ': ' + short(a) + ' <-> ' + short(b) + ' (repaired innings ' + (inn + 1) + '-' + s.settings.innings + ')']);
    } else {
      gd.log = gd.log.concat(['Inning ' + inn + ': ' + short(a) + ' <-> ' + short(b) + ' (this inning only)']);
    }
    return {gd:gd, plan:plan, modal:null, sel:null};
  }, futureToo ? 'Swapped and repaired future innings' : 'Swapped for inning ' + inn + ' only');
}
function pullPlayer(id, reason){
  var inn = App.state.gd.inning;
  mut(function(s){
    var a = Object.assign({}, s.avail); a[id] = reason;
    var plan = s.plan.map(function(o, i){
      if(i + 1 < inn) return Object.assign({}, o);
      var m = Object.assign({}, o);
      delete m[id];
      return m;
    });
    var gd = {inning:s.gd.inning, actual:Object.assign({}, s.gd.actual),
      log:s.gd.log.concat([short(id) + ' out (' + reason + ') from inning ' + inn])};
    return {avail:a, plan:plan, gd:gd, order:s.order.filter(function(x){ return x !== id; }), modal:null};
  }, short(id) + ' pulled - auto-fill the open spots');
}

/* ============================================================
   CSV IMPORT
   Two header rows: a sparse section row (Batting / Pitching / Fielding)
   then the field row. Repeated fields such as GP, H, R, BB and SO are
   disambiguated by section. Blanks, N/A and dashes stay null.
   ============================================================ */

function splitCsv(line){
  var out = [], cur = '', q = false;
  for(var i = 0; i < line.length; i++){
    var c = line[i];
    if(c === '"'){
      if(q && line[i + 1] === '"'){ cur += '"'; i++; } else q = !q;
    } else if(c === ',' && !q){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function nz(v){
  if(v === undefined || v === null) return null;
  var s = String(v).trim().replace(/^﻿/, '');
  if(s === '' || /^(n\/a|na|-{1,3}|\.)$/i.test(s)) return null;
  return s;
}
function num(v){
  if(v === null || v === undefined) return null;
  var s = String(v).replace(/[%,\s]/g, '');
  if(s === '') return null;
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9%]/g, ''); }

var FIELD_ALIASES = {
  id:  {jersey:['number','no','num','jersey','uniform','#','playernumber'],
        last:['last','lastname','surname'],
        first:['first','firstname','given'],
        full:['name','player','playername','fullname']},
  batting: {GP:['gp','g','games','gamesplayed'], PA:['pa','plateappearances'], AB:['ab','atbats'],
        H:['h','hits'], d2:['2b','double','doubles'], d3:['3b','triple','triples'],
        HR:['hr','homerun','homeruns'], RBI:['rbi','rbis'], R:['r','runs','run'],
        BB:['bb','walks','walk'], SO:['so','k','ks','strikeouts','strikeout'],
        QAB:['qab','qabs','qualityatbats'], CP:['c%','contact%','contactpct','contact'],
        HH:['hhb','hardhit','hardhitballs'], PS:['ps','pitchesseen','pseen']},
  pitching: {IP:['ip','inningspitched'], BF:['bf','battersfaced','tbf'],
        PIT:['#p','p','pitches','pitchcount','np'], ERA:['era'], WHIP:['whip'],
        SP:['s%','strike%','strikepct','strikes%'],
        FPS:['fps%','fps','firstpitchstrike%','1stpitchstrike%','fpspct'],
        SO:['so','k','ks','strikeouts'], BB:['bb','walks'], H:['h','hits','hitsallowed'],
        ER:['er','earnedruns'], WP:['wp','wildpitches']},
  fielding: {TC:['tc','chances','totalchances'], A:['a','assists','ast'], PO:['po','putouts'],
        FPCT:['fpct','fld%','fielding%','fieldingpct','fpc'], E:['e','errors','err']}
};

function matchField(group, name){
  var n = norm(name);
  var g = FIELD_ALIASES[group];
  var keys = Object.keys(g);
  for(var i = 0; i < keys.length; i++){
    var list = g[keys[i]];
    for(var j = 0; j < list.length; j++) if(norm(list[j]) === n) return keys[i];
  }
  return null;
}

function slug(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'p';
}

function parseRoster(text){
  var lines = String(text).split(/\r?\n/).filter(function(l){ return l.trim().length; });
  if(lines.length < 3) throw new Error('Needs at least two header rows and one player row.');
  var g = splitCsv(lines[0]), h = splitCsv(lines[1]);

  /* Walk the section row left to right; a section label sticks until the next one. */
  var section = '', cols = [];
  h.forEach(function(name, i){
    var grp = nz(g[i]);
    if(grp){
      if(/batt/i.test(grp)) section = 'batting';
      else if(/pitch/i.test(grp)) section = 'pitching';
      else if(/field|defen/i.test(grp)) section = 'fielding';
    }
    var key = matchField('id', name);
    if(key) cols.push({i:i, group:'id', key:key});
    else if(section){
      var k2 = matchField(section, name);
      if(k2) cols.push({i:i, group:section, key:k2});
    }
  });

  var idFound = cols.some(function(c){ return c.group === 'id'; });
  if(!idFound) throw new Error('No player name column found in the second header row.');

  var used = {}, rows = [], skipped = 0;
  lines.slice(2).forEach(function(line){
    var c = splitCsv(line);
    var v = {id:{}, batting:{}, pitching:{}, fielding:{}};
    cols.forEach(function(col){ v[col.group][col.key] = nz(c[col.i]); });

    var first = v.id.first, last = v.id.last;
    if(!first && !last && v.id.full){
      var f = v.id.full.trim();
      if(f.indexOf(',') >= 0){ var pp = f.split(','); last = pp[0].trim(); first = (pp[1] || '').trim(); }
      else { var ws = f.split(/\s+/); last = ws.pop(); first = ws.join(' '); }
    }
    if(!last && first){ last = first; first = ''; }
    if(!last){ skipped++; return; }

    var jersey = num(v.id.jersey);
    var base = slug(first) + slug(last), id = base, k = 2;
    while(used[id]){ id = base + k; k++; }
    used[id] = 1;

    var B = v.batting, hasB = Object.keys(B).some(function(k2){ return B[k2] !== null; });
    var P = v.pitching, hasP = Object.keys(P).some(function(k2){ return P[k2] !== null; });
    var F = v.fielding, hasF = Object.keys(F).some(function(k2){ return F[k2] !== null; });
    var z = function(x){ return x === null ? 0 : x; };

    rows.push([
      id,
      jersey === null ? '' : jersey,
      first || '',
      last,
      hasB ? [z(num(B.GP)), z(num(B.PA)), z(num(B.AB)), z(num(B.H)), z(num(B.d2)), z(num(B.d3)),
              z(num(B.HR)), z(num(B.RBI)), z(num(B.R)), z(num(B.BB)), z(num(B.SO)), z(num(B.QAB)),
              num(B.CP), z(num(B.HH)), z(num(B.PS))] : null,
      hasP ? [P.IP === null ? '0.0' : String(P.IP), z(num(P.BF)), z(num(P.PIT)), num(P.ERA), num(P.WHIP),
              num(P.SP), num(P.FPS), z(num(P.SO)), z(num(P.BB)), z(num(P.H)), z(num(P.ER)), z(num(P.WP))] : null,
      hasF ? [z(num(F.TC)), z(num(F.A)), z(num(F.PO)), num(F.FPCT), z(num(F.E))] : null,
      {},
      [3,3,3,3,3,3,3,3,3],
      'flat'
    ]);
  });

  if(!rows.length) throw new Error('No player rows found below the two header rows.');
  return {rows:rows, cols:cols.length, skipped:skipped};
}

function importCsvFile(file){
  var r = new FileReader();
  r.onload = function(){
    var parsed;
    try{
      parsed = parseRoster(r.result);
    }catch(err){
      up({csvNote:'Could not read that file. ' + (err && err.message ? err.message : '') +
        ' Expected two header rows (a section row, then the field row). The current roster was kept.'});
      say('CSV could not be parsed - roster kept');
      return;
    }
    App.state.modal = {
      title:'Replace the roster?',
      body:parsed.rows.length + ' players and ' + parsed.cols + ' recognised columns were read from ' +
        file.name + '. Importing replaces the current roster, availability and defensive plan. Coach ' +
        'ratings reset to 3/5 and position experience starts empty, so mark eligibility on each player’s ' +
        'Fielding tab. This cannot be undone.',
      actions:[
        {label:'Import ' + parsed.rows.length + ' players', primary:true, on:function(){ applyImport(parsed, file.name); }},
        {label:'Cancel', primary:false, on:function(){ up({modal:null}); }}
      ]
    };
    render();
  };
  r.onerror = function(){ say('Could not read that file'); };
  r.readAsText(file);
}

function applyImport(parsed, filename){
  App.rosterRows = parsed.rows;
  setRoster(parsed.rows);
  var ids = App.roster.map(function(p){ return p.id; });
  var avail = {};
  ids.forEach(function(id){ avail[id] = 'Available'; });
  var n = App.state.settings.innings;
  Object.assign(App.state, {
    plan:blankPlan(n), locks:{}, order:ids.slice(), bLocks:{}, avail:avail,
    innWindow:{}, restrict:{}, overrides:{}, notes:{}, versions:[], recent:[],
    gd:{inning:1, actual:{}, log:[]}, finalized:false, hist:[], fut:[],
    sheet:null, modal:null, sel:null, lastMove:null,
    csvSource:filename,
    csvNote:parsed.rows.length + ' players imported from ' + filename + ' · ' + parsed.cols +
      ' columns keyed by section' + (parsed.skipped ? ' · ' + parsed.skipped + ' rows skipped (no name)' : '') +
      '. Set coach ratings and position eligibility on each player, then auto-fill a lineup.'
  });
  persist();
  say('Imported ' + parsed.rows.length + ' players');
}

/* ---------- Games ---------- */
function screenGames(ctx){

  ];
  var secondary = [
    {label:'Copy Last Game', on:function(){
      if(!isSeedRoster()){ say('No previous game stored for this roster'); return; }
      mut(function(){ return {plan:buildPlan(N, App.roster.map(function(p){ return p.id; }))}; }, 'Loaded last game’s plan');
    }},
    {label:'Start from Template', on:function(){
      mut(function(s){ return {plan:s.plan.map(function(){ return {}; })}; }, 'Blank template — auto-fill to populate');
      up({screen:'lineup', tab:'defense'});
    }},
    {label:'Generate Lineup', on:function(){
      applyOrder(st.lineupMode); fillAll(); up({screen:'lineup', tab:'defense'});
    }},
    {label:'Edit Availability', on:function(){ up({screen:'setup'}); }}
  ];

/* ---------- Batting order ---------- */
function tabBatting(ctx){
  var S = ctx.S, st = ctx.st, sel = ctx.sel, rd = ctx.rd;
  var bmAll = ['AVG','OBP','OPS','Contact %','QAB %','RBI','Trend','Coach rating'];
  var chips = bmAll.map(function(m){
    var active = S.batMetrics.indexOf(m) >= 0;
    return '<button ' + C(function(){
      up({batMetrics: active ? S.batMetrics.filter(function(x){ return x !== m; }) : S.batMetrics.concat([m]).slice(-2)});
    }) + ' style="min-height:34px;padding:0 10px;border:1px solid ' + (active ? '#0F2440' : '#CBD5E1') +
      ';background:' + (active ? '#0F2440' : '#fff') + ';color:' + (active ? '#fff' : '#5A6B84') +
      ';border-radius:8px;font-size:11px;font-weight:700">' + e(m) + '</button>';
  }).join('');

  function metricVal(p, m){
    if(m === 'Coach rating') return p.ratings.contact + '/5 contact';
    if(m === 'Trend') return p.trend === 'up' ? 'Trending up' : (p.trend === 'down' ? 'Trending down' : 'Steady');
    if(!p.b) return '—';
    if(m === 'AVG') return f3(p.b.AVG);
    if(m === 'OBP') return f3(p.b.OBP);
    if(m === 'OPS') return f3(p.b.OPS);
    if(m === 'Contact %') return p1(p.b.contactPercent);
    if(m === 'QAB %') return p1(p.b.QABPercent);
    if(m === 'RBI') return String(p.b.RBI);
    return '—';
  }

  var rankIds = rd.ranked.map(function(x){ return x.p.id; });
  var slots = battingSlots();
  var rows = slots.map(function(slot, i){
    var id = slot.id, oi = slot.oi;
    var p = App.byId[id];
    var av = S.avail[id] || 'Available';
    var r = S.restrict[id] || {};
    var at = rankIds.indexOf(id);
    var badge = p.isNewPlayer ? 'NEW' : (at >= 0 ? '#' + (at + 1) + ' ' + rd.metric.k : 'UNRANKED');
    var selHere = sel && sel.kind === 'bat' && sel.id === id;
    var lockedSpot = !!S.bLocks[oi];
    var s1 = S.batMetrics[0] ? S.batMetrics[0] + ' ' + metricVal(p, S.batMetrics[0]) : '';
    var s2 = S.batMetrics[1] ? S.batMetrics[1] + ' ' + metricVal(p, S.batMetrics[1]) : '';
    var note = av !== 'Available' ? av : ((r.noPitch || r.noCatch || r.throwLimit) ? 'Restriction set' : '');
    var noteC = av !== 'Available' ? '#B45309' : '#B91C1C';

    return '<div data-drop="b:' + oi + '" ' + C(function(){ tapDest('b:' + oi); }) +
      ' style="background:' + (selHere ? '#EFF6FF' : '#fff') + ';border:' + (selHere ? '2px' : '1px') +
      ' solid ' + (selHere ? '#1D4ED8' : '#E2E8F0') + ';border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:9px;min-height:62px">' +
      '<button ' + PD(function(ev){ startDrag(ev, 'bat', id, oi); }) + ' aria-label="Drag to reorder" style="flex:none;width:30px;height:46px;border:none;background:#F1F5F9;border-radius:8px;color:#7C8AA0;font-size:15px;font-weight:800;line-height:1;touch-action:none;cursor:grab">⠿</button>' +
      '<span style="flex:none;width:24px;text-align:center;font-size:17px;font-weight:800;color:#0F2440">' + (i + 1) + '</span>' +
      '<button ' + C(function(){
          if(sel && sel.kind === 'bat' && sel.id !== id) swapOrderIdx(App.state.order.indexOf(sel.id), oi);
          else up({sheet:id, sheetTab:'OVERVIEW', sheetMore:false});
        }) + ' style="flex:1;min-width:0;text-align:left;border:none;background:none;padding:0">' +
        '<span style="display:flex;align-items:center;gap:6px">' +
          '<span style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + e(p.displayName) + '</span>' +
          '<span style="font-size:11px;font-weight:700;color:#94A3B8">#' + e(p.jerseyNumber) + '</span>' +
        '</span>' +
        '<span style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap">' +
          '<span style="font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:' + (p.isNewPlayer ? '#DBEAFE' : '#EEF2FF') + ';color:' + (p.isNewPlayer ? '#1E40AF' : '#3730A3') + '">' + e(badge) + '</span>' +
          '<span style="font-size:11px;font-weight:700;color:#475569">' + e(s1) + '</span>' +
          '<span style="font-size:11px;font-weight:700;color:#475569">' + e(s2) + '</span>' +
          '<span style="font-size:11px;font-weight:800;color:' + noteC + '">' + e(note) + '</span>' +
        '</span>' +
      '</button>' +
      '<button ' + C(function(){ toggleBLock(oi); }) + ' style="flex:none;min-width:44px;height:44px;border:none;border-radius:9px;background:' +
        (lockedSpot ? '#0F2440' : '#F1F5F9') + ';color:' + (lockedSpot ? '#fff' : '#64748B') + ';font-size:9px;font-weight:800;letter-spacing:.04em">' +
        (lockedSpot ? 'LOCKED' : 'LOCK') + '</button>' +
    '</div>';
  }).join('');

  var actions = [
    {label:'Regenerate unlocked', on:function(){ applyOrder(st.lineupMode); }},
    {label:'Copy previous game', on:function(){
      if(!isSeedRoster()){ say('No previous game stored for this roster'); return; }
      mut(function(){ return {order:ACTIVE.slice()}; }, 'Previous game order restored');
    }},
    {label:'Rotate lineup', on:function(){ rotateOrder(); }},
    {label:'Save version', on:function(){ saveVersion(); }},
    {label:S.compare ? 'Hide comparison' : 'Compare modes', on:function(){ up({compare:!S.compare}); }}
  ].map(function(a){
    return '<button ' + C(a.on) + ' style="min-height:44px;padding:0 12px;border:1px solid #CBD5E1;background:#fff;border-radius:10px;font-size:12px;font-weight:700;color:#0F2440">' + e(a.label) + '</button>';
  }).join('');

  var versions = S.versions.length
    ? '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px">' +
        '<div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#64748B;text-transform:uppercase;margin-bottom:7px">Saved versions</div>' +
        '<div style="display:flex;gap:7px;flex-wrap:wrap">' +
        S.versions.map(function(v, i){
          return '<button ' + C(function(){ loadVersion(i); }) + ' style="min-height:40px;padding:0 12px;border:1px solid #CBD5E1;background:#F8FAFC;border-radius:9px;font-size:12px;font-weight:700">' + e(v.name) + '</button>';
        }).join('') + '</div></div>'
    : '';

  var compare = S.compare
    ? '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
      ['Development','Balanced','Competitive'].map(function(m){
        var names = genOrder(m).slice(0, 10).map(function(id, i){
          return '<div style="font-size:10px;font-weight:600;color:#475569;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (i + 1) + '. ' + e(short(id)) + '</div>';
        }).join('');
        return '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:9px 8px">' +
          '<div style="font-size:10px;font-weight:800;color:#0F2440;letter-spacing:.04em;margin-bottom:6px">' + m + '</div>' + names +
          '<button ' + C(function(){ applyOrder(m); }) + ' style="width:100%;min-height:36px;margin-top:7px;border:1px solid #1D4ED8;background:#EFF6FF;color:#1D4ED8;border-radius:8px;font-size:11px;font-weight:800">Use</button></div>';
      }).join('') + '</div>'
    : '';

  var selNote = (sel && sel.kind === 'bat')
    ? '<div style="background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700">' +
      e('Tap another row to swap with ' + short(sel.id)) + '</div>'
    : '';

  var empty = slots.length ? '' :
    '<div style="background:#fff;border:1px dashed #CBD5E1;border-radius:12px;padding:16px;text-align:center;font-size:13px;color:#5A6B84">Nobody is set to bat. Check availability on the Setup screen.</div>';

  return '<div style="padding:12px 14px 4px;display:flex;flex-direction:column;gap:10px">' +
    '<div><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:#64748B;text-transform:uppercase;margin-bottom:6px">Show two stats</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + chips + '</div></div>' +
    selNote +
    '<div style="display:flex;flex-direction:column;gap:7px">' + rows + empty + '</div>' +
    '<div class="no-print" style="display:flex;gap:7px;flex-wrap:wrap">' + actions + '</div>' +
    versions + compare +
  '</div>';
}

/* ---------- Defense ---------- */
function defChip(ctx, id, pos, innN, w, hHandle, hChip){
  var S = ctx.S, sel = ctx.sel;
  var p = App.byId[id];
  var lk = locked(innN, id);
  var isSel = sel && sel.kind === 'def' && sel.id === id;
  var flash = S.lastMove && S.lastMove.inning === innN && S.lastMove.ids.indexOf(id) >= 0;
  return '<div style="background:' + col(pos) + ';border:' + (isSel || lk ? '2px' : '1px') + ' solid ' +
    (isSel ? '#1D4ED8' : (lk ? '#0F2440' : 'rgba(15,36,64,.16)')) +
    ';border-radius:10px;display:flex;align-items:center;gap:2px;padding:3px;min-height:' + hChip + 'px' +
    (w ? ';width:' + w + 'px' : '') + ';animation:' + (flash ? 'pop .22s ease-out' : 'none') + '">' +
    '<button ' + PD(function(ev){ startDrag(ev, 'def', id, {inning:innN}); }) + ' aria-label="Drag ' + e(chipName(id)) + '" style="flex:none;width:' + (w ? 20 : 18) + 'px;height:' + hHandle + 'px;border:none;background:rgba(255,255,255,.6);border-radius:6px;color:#33455E;font-size:11px;font-weight:800;touch-action:none;cursor:grab;padding:0">⠿</button>' +
    '<button ' + C(function(){ up({sheet:id, sheetTab:'OVERVIEW', sheetMore:false}); }) + ' style="flex:1;min-width:0;border:none;background:none;text-align:left;padding:0">' +
      '<span style="display:block;font-size:11px;font-weight:800;color:' + colT(pos) + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2">' + e(chipName(id)) + '</span>' +
      '<span style="display:block;font-size:9px;font-weight:700;color:' + colT(pos) + ';opacity:.72">#' + e(p.jerseyNumber) + '</span>' +
    '</button>' +
    '<button ' + C(function(){ toggleLock(innN, id); }) + ' aria-label="Lock" style="flex:none;width:16px;height:' + hHandle + 'px;border:none;background:none;color:' + colT(pos) + ';font-size:10px;font-weight:800;padding:0">' + (lk ? '▣' : '□') + '</button>' +
  '</div>';
}

function fieldView(ctx){
  var S = ctx.S, A = ctx.A, inn = ctx.inn, sel = ctx.sel, chipW = ctx.chipW, fieldH = ctx.fieldH;

  var slots = POS.map(function(pos){
    var id = playerAt(inn, pos);
    var over = S.over === 'd:' + pos;
    var ring = over ? '0 0 0 3px #1D4ED8' : (sel ? '0 0 0 2px #93C5FD' : 'none');
    var inner = id
      ? defChip(ctx, id, pos, inn, null, 39, 45)
      : '<div style="min-height:45px;border:2px dashed #AFBDD1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#8494AB;background:rgba(255,255,255,.72)">EMPTY</div>';
    return '<div data-drop="d:' + pos + '" ' + C(function(){ tapDest('d:' + pos); }) +
      ' style="position:absolute;left:' + SLOTX[pos] + '%;top:' + Math.round(SLOTY[pos] * fieldH) + 'px;transform:translateX(-50%);width:' + chipW + 'px;box-shadow:' + ring + ';border-radius:11px">' +
      '<div style="text-align:center;height:15px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#33455E">' + pos + '</div>' +
      inner + '</div>';
  }).join('');

  var resting = A.ids.filter(function(id){ return (S.plan[inn - 1] || {})[id] === 'REST'; });
  var unassigned = A.ids.filter(function(id){ return !(S.plan[inn - 1] || {})[id]; });
  var benchRing = S.over === ('rest:' + inn) ? '0 0 0 3px #1D4ED8' : (sel ? '0 0 0 2px #93C5FD' : 'none');
  var benchChips = resting.length
    ? resting.map(function(id){ return defChip(ctx, id, 'REST', inn, chipW, 40, 46); }).join('')
    : '<div style="flex:1;display:flex;align-items:center;justify-content:center;border:2px dashed #C7D1DF;border-radius:10px;font-size:11px;font-weight:700;color:#8494AB;min-height:46px">Nobody resting this inning</div>';

  var unassignedHtml = unassigned.length
    ? '<div style="margin-top:9px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:12px;padding:9px 11px">' +
      '<div style="font-size:11px;font-weight:800;color:#9A3412;letter-spacing:.08em;margin-bottom:7px">UNASSIGNED — DRAG ONTO THE FIELD</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap">' +
      unassigned.map(function(id){
        return '<div style="background:#fff;border:1px solid #FDBA74;border-radius:10px;display:flex;align-items:center;gap:3px;padding:3px;min-height:46px;width:' + chipW + 'px">' +
          '<button ' + PD(function(ev){ startDrag(ev, 'def', id, {inning:inn}); }) + ' style="flex:none;width:20px;height:40px;border:none;background:#FFEDD5;border-radius:6px;color:#9A3412;font-size:11px;font-weight:800;touch-action:none;cursor:grab;padding:0">⠿</button>' +
          '<button ' + C(function(){ up({sheet:id, sheetTab:'OVERVIEW', sheetMore:false}); }) + ' style="flex:1;min-width:0;border:none;background:none;text-align:left;padding:0;font-size:11px;font-weight:800;color:#9A3412">' + e(chipName(id)) + '</button>' +
        '</div>';
      }).join('') + '</div></div>'
    : '';

  return '<div style="max-width:560px;margin:0 auto">' +
    '<div style="position:relative;width:100%;height:' + fieldH + 'px">' +
      '<div style="position:absolute;left:0;right:0;top:16px;bottom:22px;background:#E9F2E4;border:1px solid #D6E4CF;border-radius:100% 100% 16px 16px"></div>' +
      '<div style="position:absolute;left:50%;top:50%;width:' + ctx.diamond + 'px;height:' + ctx.diamond + 'px;transform:translate(-50%,-50%) rotate(45deg);background:#F3E8D8;border:1px solid #E2D2BA;border-radius:8px"></div>' +
      slots +
    '</div>' +
    '<div data-drop="rest:' + inn + '" ' + C(function(){ tapDest('rest:' + inn); }) +
      ' style="margin-top:10px;background:#fff;border:1px solid #D8E0EA;border-radius:14px;padding:10px 11px;box-shadow:' + benchRing + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
        '<span style="font-size:11px;font-weight:800;letter-spacing:.12em;color:#33455E">REST / BENCH</span>' +
        '<span style="font-size:11px;font-weight:700;color:#7C8AA0">' + resting.length + ' resting</span>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;min-height:52px">' + benchChips + '</div>' +
    '</div>' + unassignedHtml + '</div>';
}

function gridView(ctx){
  var S = ctx.S, A = ctx.A, N = ctx.N, inn = ctx.inn, sel = ctx.sel;
  var modes = [['player','Player View'],['position','Position View']].map(function(g){
    var active = S.gridMode === g[0];
    return '<button ' + C(function(){ up({gridMode:g[0]}); }) + ' style="min-height:40px;padding:0 13px;border:1px solid ' +
      (active ? '#1D4ED8' : '#CBD5E1') + ';background:' + (active ? '#1D4ED8' : '#fff') + ';color:' +
      (active ? '#fff' : '#5A6B84') + ';border-radius:9px;font-size:12px;font-weight:800">' + g[1] + '</button>';
  }).join('');

  var head = '';
  for(var i = 1; i <= N; i++){
    head += '<th style="position:sticky;top:0;z-index:3;background:' + (i === inn ? '#EFF6FF' : '#F8FAFC') +
      ';padding:9px 6px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#475569;border-bottom:1px solid #D8E0EA;border-right:1px solid #EEF2F7;min-width:88px">INN ' + i + '</th>';
  }

  var body = '';
  if(S.gridMode === 'player'){
    body = A.ids.map(function(id){
      var p = App.byId[id];
      var cells = '';
      for(var i = 1; i <= N; i++){
        (function(i){
          var pos = posOf(i, id);
          var lk = locked(i, id);
          var isSel = sel && sel.kind === 'def' && sel.id === id && sel.meta && sel.meta.inning === i;
          var isOver = S.over === 'g:' + id + ':' + i;
          var warn = pos && pos !== 'REST' && (expStatus(id, pos) === 'New position' || !eligible(id, pos));
          cells += '<td data-drop="g:' + id + ':' + i + '" ' + C(function(){ tapDest('g:' + id + ':' + i); }) +
            ' style="padding:5px;border-bottom:1px solid #E7ECF3;border-right:1px solid #EEF2F7">' +
            '<div ' + PD(function(ev){ startDrag(ev, 'def', id, {inning:i}); }) +
            ' style="background:' + (pos ? col(pos) : '#F8FAFC') + ';color:' + (pos ? colT(pos) : '#94A3B8') +
            ';border:' + (isSel || isOver ? '2px' : '1px') + ' solid ' + (isSel || isOver ? '#1D4ED8' : '#E2E8F0') +
            ';border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;touch-action:none;cursor:grab">' +
            e(pos || '—') +
            (lk ? '<span style="font-size:9px;font-weight:800">▣</span>' : '') +
            (warn ? '<span style="width:14px;height:14px;border-radius:50%;background:#B45309;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center">!</span>' : '') +
            '</div></td>';
        })(i);
      }
      return '<tr><td style="position:sticky;left:0;z-index:2;background:#fff;padding:6px 11px;border-bottom:1px solid #E7ECF3;border-right:1px solid #D8E0EA">' +
        '<button ' + C(function(){ up({sheet:id, sheetTab:'OVERVIEW', sheetMore:false}); }) + ' style="border:none;background:none;text-align:left;padding:0">' +
        '<span style="display:block;font-size:13px;font-weight:700;color:#0F2440">' + e(p.displayName) + '</span>' +
        '<span style="display:block;font-size:10px;font-weight:700;color:#94A3B8">#' + e(p.jerseyNumber) + ' · ' + (A.def[id] || 0) + ' inn · ' + (A.rest[id] || 0) + ' rest</span>' +
        '</button></td>' + cells + '</tr>';
    }).join('');
  } else {
    body = POS.concat(['REST']).map(function(pos){
      var cells = '';
      for(var i = 1; i <= N; i++){
        (function(i){
          if(pos === 'REST'){
            var rs = A.ids.filter(function(id){ return (S.plan[i - 1] || {})[id] === 'REST'; });
            cells += '<td style="padding:5px;border-bottom:1px solid #E7ECF3;border-right:1px solid #EEF2F7">' +
              '<div style="background:#F1F5F9;color:#334155;border:1px solid #E2E8F0;border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-align:center;padding:2px 4px">' +
              e(rs.length ? rs.map(short).join(', ') : '—') + '</div></td>';
            return;
          }
          var id = playerAt(i, pos);
          var isOver = S.over === 'p:' + pos + ':' + i;
          var lk = id ? locked(i, id) : false;
          cells += '<td data-drop="p:' + pos + ':' + i + '" ' + C(function(){ tapDest('p:' + pos + ':' + i); }) +
            ' style="padding:5px;border-bottom:1px solid #E7ECF3;border-right:1px solid #EEF2F7">' +
            '<div ' + (id ? PD(function(ev){ startDrag(ev, 'def', id, {inning:i}); }) : '') +
            ' style="background:' + (id ? col(pos) : '#FEF2F2') + ';color:' + (id ? colT(pos) : '#B91C1C') +
            ';border:' + (isOver ? '2px' : '1px') + ' solid ' + (isOver ? '#1D4ED8' : '#E2E8F0') +
            ';border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800;text-align:center;padding:2px 4px;touch-action:none' + (id ? ';cursor:grab' : '') + '">' +
            e(id ? chipName(id) : 'EMPTY') + (lk ? '<span style="font-size:9px">▣</span>' : '') + '</div></td>';
        })(i);
      }
      return '<tr><td style="position:sticky;left:0;z-index:2;background:#fff;padding:6px 11px;border-bottom:1px solid #E7ECF3;border-right:1px solid #D8E0EA">' +
        '<span style="display:inline-block;background:' + col(pos) + ';color:' + colT(pos) + ';font-size:12px;font-weight:800;padding:4px 9px;border-radius:7px">' + pos + '</span></td>' + cells + '</tr>';
    }).join('');
  }

  return '<div><div style="display:flex;gap:7px;margin-bottom:9px">' + modes + '</div>' +
    '<div style="background:#fff;border:1px solid #D8E0EA;border-radius:12px;overflow:auto;max-height:520px">' +
    '<table style="border-collapse:separate;border-spacing:0;width:100%">' +
      '<thead><tr><th style="position:sticky;left:0;top:0;z-index:4;background:#EEF2F7;text-align:left;padding:9px 11px;font-size:10px;font-weight:800;letter-spacing:.1em;color:#475569;border-bottom:1px solid #D8E0EA;border-right:1px solid #D8E0EA;min-width:150px">' +
      (S.gridMode === 'player' ? 'PLAYER' : 'POSITION') + '</th>' + head + '</tr></thead>' +
      '<tbody>' + body + '</tbody></table></div></div>';
}

function tabDefense(ctx){
  var S = ctx.S, A = ctx.A, N = ctx.N, inn = ctx.inn, W = ctx.W, sel = ctx.sel;

  var innChips = '';
  for(var i = 1; i <= N; i++){
    (function(i){
      var active = i === inn;
      var m = S.plan[i - 1] || {};
      var cnt = Object.keys(m).filter(function(id){ return m[id] && m[id] !== 'REST' && inGame(id); }).length;
      innChips += '<button ' + C(function(){ up({inning:i}); }) + ' style="width:44px;height:44px;border:1px solid ' +
        (active ? '#0F2440' : (cnt === 9 ? '#CBD5E1' : '#FCD34D')) + ';background:' +
        (active ? '#0F2440' : (cnt === 9 ? '#fff' : '#FEF3C7')) + ';color:' + (active ? '#fff' : '#3A4B63') +
        ';border-radius:10px;font-size:15px;font-weight:800;position:relative">' + i +
        '<span style="position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:' +
        (cnt === 9 ? '#34D399' : '#F59E0B') + '"></span></button>';
    })(i);
  }

  var toggle = '';
  if(W){
    toggle = '<span style="display:flex;gap:6px;margin-left:auto">' +
      [['field','Field View'],['grid','Grid View']].map(function(v){
        var active = S.view === v[0];
        return '<button ' + C(function(){ up({view:v[0]}); }) + ' style="min-height:44px;padding:0 12px;border:1px solid ' +
          (active ? '#0F2440' : '#CBD5E1') + ';background:' + (active ? '#0F2440' : '#fff') + ';color:' +
          (active ? '#fff' : '#5A6B84') + ';border-radius:10px;font-size:12px;font-weight:800">' + v[1] + '</button>';
      }).join('') + '</span>';
  }

  var pillTxt = A.red.length ? A.red.length + ' conflict' + (A.red.length > 1 ? 's' : '')
    : (A.amber.length ? A.amber.length + ' to review' : 'Lineup healthy');
  var pillBg = A.red.length ? '#FEE2E2' : (A.amber.length ? '#FEF3C7' : '#DCFCE7');
  var pillFg = A.red.length ? '#991B1B' : (A.amber.length ? '#92400E' : '#166534');

  var selNote = (sel && sel.kind === 'def')
    ? '<div style="background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;margin-bottom:8px">' +
      e(short(sel.id) + ' selected — tap a position or the rest tray') + '</div>' : '';

  var showGrid = W && S.view === 'grid';
  var main = showGrid ? gridView(ctx) : fieldView(ctx);

  var more = [
    {label:'Redo', on:function(){ redo(); }},
    {label:'Duplicate to next inning', on:function(){ copyInning(inn, Math.min(N, inn + 1)); }},
    {label:'Clear inning', on:function(){ clearInning(inn); }},
    {label:'Regenerate unlocked', on:function(){ fill(inn, false); }},
    {label:'Generate all innings', on:function(){ fillAll(); }},
    {label:'Lock selection all innings', on:function(){
      if(sel && sel.kind === 'def') lockAllInnings(sel.id); else say('Tap a player’s handle first');
    }}
  ].map(function(a){
    return '<button ' + C(a.on) + ' style="min-height:40px;padding:0 11px;border:1px solid #CBD5E1;background:#fff;border-radius:9px;font-size:11px;font-weight:700;color:#33455E">' + e(a.label) + '</button>';
  }).join('');

  var bar = [
    {label:'UNDO', on:function(){ undo(); }, bg:'#fff', fg:'#0F2440', bd:'#CBD5E1'},
    {label:'COPY INNING', on:function(){ copyInning(inn - 1 >= 1 ? inn - 1 : 1, inn); }, bg:'#fff', fg:'#0F2440', bd:'#CBD5E1'},
    {label:'AUTO-FILL', on:function(){ fill(inn, true); }, bg:'#fff', fg:'#0F2440', bd:'#CBD5E1'},
    {label:'REVIEW', on:function(){ up({tab:'review'}); }, bg:'#1D4ED8', fg:'#fff', bd:'#1D4ED8'}
  ].map(function(a){
    return '<button ' + C(a.on) + ' style="flex:1;min-height:48px;border:1px solid ' + a.bd + ';background:' + a.bg +
      ';color:' + a.fg + ';border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.04em">' + a.label + '</button>';
  }).join('');

  return '<div style="padding:10px 14px 4px">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">' +
      '<button ' + C(function(){ up({inning:Math.max(1, inn - 1)}); }) + ' style="flex:none;width:44px;height:44px;border:1px solid #CBD5E1;background:#fff;border-radius:10px;font-size:16px;font-weight:800;color:#0F2440">‹</button>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:16px;font-weight:800;line-height:1.1">Inning ' + inn + ' of ' + N + '</div>' +
        '<div style="display:inline-block;margin-top:3px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:' + pillBg + ';color:' + pillFg + '">' + e(pillTxt) + '</div>' +
      '</div>' +
      '<button ' + C(function(){ up({inning:Math.min(N, inn + 1)}); }) + ' style="flex:none;width:44px;height:44px;border:1px solid #CBD5E1;background:#fff;border-radius:10px;font-size:16px;font-weight:800;color:#0F2440">›</button>' +
    '</div>' +

function shareLineup(){
  var S = App.state, st = S.settings, N = st.innings;
  var lines = ['Dugout Lineup — vs ' + st.opponent, st.date + ' ' + st.time + ' · ' + st.field, ''];
  lines.push('BATTING ORDER');
  battingSlots().forEach(function(slot, i){
    lines.push((i + 1) + '. ' + App.byId[slot.id].displayName + ' #' + App.byId[slot.id].jerseyNumber);
  });
  lines.push('');
  lines.push('DEFENSE BY INNING');
  var hdr = ['POS'];
  for(var i = 1; i <= N; i++) hdr.push('I' + i);
  lines.push(hdr.join('\t'));
  POS.forEach(function(pos){
    var row = [pos];
    for(var i = 1; i <= N; i++){ var id = playerAt(i, pos); row.push(id ? short(id) : '—'); }
    lines.push(row.join('\t'));
  });
  var txt = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ say('Lineup copied to clipboard'); },
      function(){ say('Could not copy — try Print instead'); });
  } else {
    say('Clipboard unavailable — try Print instead');
  }
}

/* ---------- Game Day ---------- */
function tabGameday(ctx){
  var S = ctx.S, A = ctx.A, N = ctx.N, sel = ctx.sel, chipW = ctx.chipW, fieldH = ctx.fieldH;

  var nextIdx = Math.min(N, gi + 1);
  var recorded = !!S.gd.actual[gi];

  var changes = [];
  if(nextIdx > gi){
    A.ids.forEach(function(id){
      var a = actualOf(gi, id), b = posOf(nextIdx, id);
      if(a === b) return;
      changes.push({name:short(id), from:a || '—', to:b || '—',
        fbg:col(a || 'REST'), ffg:colT(a || 'REST'), tbg:col(b || 'REST'), tfg:colT(b || 'REST')});

  var nextC = playerAt(nextIdx, 'C');

  var log = S.gd.log.length

      }).join('') + '</div>'
    : '';

/* ---------- backup and restore ---------- */
var BACKUP_NAME = 'dugout-lineup-backup.json';

function backupJson(){
  var d = {};
  PERSIST_KEYS.forEach(function(k){ d[k] = App.state[k]; });
  d.rosterRows = App.rosterRows;
  return JSON.stringify({app:'dugout-lineup', v:3,
    exportedAt:new Date().toISOString(), state:{v:3, d:d}}, null, 2);
}

function saveViaLink(text){
  try{
    var blob = new Blob([text], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = BACKUP_NAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    say('Backup downloaded');
  }catch(err){ say('Could not create the backup file'); }
}

/* Two very different hosts: opened as a local file the page downloads the blob
   itself; published as an Artifact the viewer mediates the save and a plain
   download link is inert, so ask the host instead. */
function exportBackup(){
  var json = backupJson();
  if(!(window.claude && typeof window.claude.use === 'function')){ saveViaLink(json); return; }
  say('Preparing backup…');
  window.claude.use('downloads').then(function(dl){
    if(!dl){ say('Saving files is not available in this view'); return; }
    return dl.save({filename:BACKUP_NAME, data:json}).then(
      function(){ say('Backup saved'); },
      function(err){
        var code = err && err.code;
        if(code === 'declined') say('Backup cancelled');
        else if(code === 'rate_limited') say('Try that again in a moment');
        else if(code === 'too_large') say('This backup is too large to save');
        else say('Could not save the backup here');
      });
  }, function(){ say('Could not save the backup here'); });
}

function restoreBackup(file){
  var r = new FileReader();
  r.onload = function(){
    var payload = null;
    try{ payload = JSON.parse(r.result); }catch(err){}
    if(!payload || payload.app !== 'dugout-lineup' || !payload.state || !payload.state.d){
      say('That is not a Dugout Lineup backup file');
      return;
    }
    var when = 'an unknown time';
    if(payload.exportedAt){
      var dt = new Date(payload.exportedAt);
      if(!isNaN(dt.getTime())) when = dt.toLocaleString();
    }
    var rows = payload.state.d.rosterRows;
    App.state.modal = {
      title:'Restore this backup?',
      body:'Backed up ' + when + ' · ' + (rows ? rows.length + ' imported players' : 'seed roster') +
        '. Restoring replaces the roster, plan, availability, notes and saved versions on this device.',
      actions:[
        {label:'Restore', primary:true, on:function(){ applyRestore(payload); }},
        {label:'Cancel', primary:false, on:function(){ up({modal:null}); }}
      ]
    };
    render();
  };
  r.onerror = function(){ say('Could not read that file'); };
  r.readAsText(file);
}

function applyRestore(payload){
  try{
    App.rosterRows = payload.state.d.rosterRows || null;
    setRoster(App.rosterRows || SEED);
    App.state = boot(payload.state.d);
    App.state.modal = null;
    persist();
    say('Backup restored');
  }catch(err){
    up({modal:null});
    say('That backup could not be restored');
  }
}
