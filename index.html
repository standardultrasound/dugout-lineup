/* ============================================================
   DOM PATCHING
   The view is a string. Rather than replacing innerHTML - which would
   lose scroll position, focus, caret and in-flight pointer captures -
   the new tree is diffed against the live one and only differences applied.
   ============================================================ */

function syncAttrs(o, n){
  var i, at;
  var na = n.attributes;
  for(i = 0; i < na.length; i++){
    at = na[i];
    if(o.getAttribute(at.name) !== at.value) o.setAttribute(at.name, at.value);
  }
  var oa = Array.prototype.slice.call(o.attributes);
  for(i = 0; i < oa.length; i++){
    if(!n.hasAttribute(oa[i].name)) o.removeAttribute(oa[i].name);
  }
}

function patchNode(parent, o, n){
  if(o.nodeType !== n.nodeType || (o.nodeType === 1 && o.tagName !== n.tagName)){
    parent.replaceChild(n, o);
    return;
  }
  if(o.nodeType === 3 || o.nodeType === 8){
    if(o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
    return;
  }
  if(o.nodeType !== 1) return;

  syncAttrs(o, n);
  var tag = o.tagName;

  if(tag === 'INPUT'){
    var type = (n.getAttribute('type') || 'text').toLowerCase();
    if(type === 'file') return;                       // never reset a file picker
    if(type === 'checkbox' || type === 'radio'){ o.checked = n.hasAttribute('checked'); return; }
    if(document.activeElement !== o){                 // don't fight the user's caret
      var v = n.getAttribute('value');
      if(v !== null && o.value !== v) o.value = v;
    }
    return;
  }
  if(tag === 'TEXTAREA'){
    if(document.activeElement !== o && o.value !== n.textContent) o.value = n.textContent;
    return;
  }

  patchChildren(o, n);

  if(tag === 'SELECT'){
    var want = null;
    Array.prototype.forEach.call(n.querySelectorAll('option'), function(op){
      if(op.hasAttribute('selected')) want = op.value;
    });
    if(want !== null && o.value !== want) o.value = want;
  }
}

function patchChildren(a, b){
  var an = Array.prototype.slice.call(a.childNodes);
  var bn = Array.prototype.slice.call(b.childNodes);
  var i;
  for(i = 0; i < bn.length; i++){
    if(i < an.length) patchNode(a, an[i], bn[i]);
    else a.appendChild(bn[i]);
  }
  for(i = an.length - 1; i >= bn.length; i--) a.removeChild(an[i]);
}

function morph(root, html){
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  patchChildren(root, tmp);
}

/* ============================================================
   RENDER
   ============================================================ */

function render(){
  HANDLERS = {}; HID = 0;
  var html;
  try{
    html = view();
  }catch(err){
    fail(err);
    return;
  }
  morph(document.getElementById('app'), html);
}

function fail(err){
  var el = document.getElementById('boot-error');
  if(!el) return;
  el.style.display = 'block';
  el.textContent = 'Dragons Travel hit an error and stopped.\n\n' +
    (err && err.stack ? err.stack : String(err)) +
    '\n\nReload the page. If it keeps happening, run this in the browser console to clear saved data:\n' +
    "  localStorage.removeItem('" + LS + "'); location.reload();";
  if(window.console && console.error) console.error(err);
}

/* ============================================================
   POINTER DRAG AND DROP
   One code path drives both mouse and touch. A press that never moves
   more than a few pixels is treated as a tap: it selects the player so
   the next tap on a position drops them there.
   ============================================================ */

function startDrag(ev, kind, id, meta){
  var innForLock = (meta && meta.inning) ? meta.inning : App.state.inning;
  if(kind === 'def' && locked(innForLock, id)){ say('Locked — unlock to move ' + short(id)); return; }
  if(ev.button !== undefined && ev.button !== 0) return;
  ev.preventDefault();
  ev.stopPropagation();

  var st = {x:ev.clientX, y:ev.clientY, moved:false};
  var ghost = document.getElementById('ghost');

  function mv(e2){
    var dx = e2.clientX - st.x, dy = e2.clientY - st.y;
    if(!st.moved && Math.abs(dx) + Math.abs(dy) < 7) return;
    if(!st.moved){
      st.moved = true;
      App.state.drag = {kind:kind, id:id, meta:meta};
      App.state.sel = null;
      ghost.textContent = short(id);
      ghost.hidden = false;
      render();
    }
    ghost.style.transform = 'translate(' + (e2.clientX - 46) + 'px,' + (e2.clientY - 20) + 'px)';
    var el = document.elementFromPoint(e2.clientX, e2.clientY);
    var dz = (el && el.closest) ? el.closest('[data-drop]') : null;
    var key = dz ? dz.getAttribute('data-drop') : null;
    if(key !== App.state.over){ App.state.over = key; render(); }
  }

  function done(){
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', done);
    window.removeEventListener('pointercancel', done);
    ghost.hidden = true;
    if(st.moved){
      var key = App.state.over;
      App.state.drag = null;
      App.state.over = null;
      if(key) drop(key, kind, id, meta); else render();
    } else {
      var s = App.state.sel;
      App.state.sel = (s && s.id === id && s.kind === kind) ? null : {kind:kind, id:id, meta:meta};
      render();
    }
  }

  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', done);
  window.addEventListener('pointercancel', done);
}

function drop(key, kind, id, meta){
  var parts = String(key).split(':');
  if(kind === 'bat'){
    if(parts[0] === 'b') moveOrder(meta, parseInt(parts[1], 10));
    else render();
    return;
  }
  if(parts[0] === 'd'){ assign(App.state.inning, id, parts[1]); return; }
  if(parts[0] === 'rest'){ assign(parseInt(parts[1] || App.state.inning, 10), id, 'REST'); return; }
  if(parts[0] === 'g'){
    var tid = parts[1], inn = parseInt(parts[2], 10);
    if(tid === id){ render(); return; }
    var srcInn = (meta && meta.inning) || App.state.inning;
    if(inn !== srcInn){ say('Moves stay inside one inning'); return; }
    assign(inn, id, posOf(inn, tid) || 'REST');
    return;
  }
  if(parts[0] === 'p'){ assign(parseInt(parts[2], 10), id, parts[1]); return; }
  render();
}

function tapDest(key){
  var s = App.state.sel;
  if(!s) return;
  drop(key, s.kind, s.id, s.meta);
}

/* ============================================================
   EVENT DELEGATION
   Handlers live in a table that is rebuilt each render; the markup only
   carries the key. That keeps the diff cheap and avoids stale closures.
   ============================================================ */

function elOf(ev){
  var t = ev.target;
  if(!t) return null;
  return t.nodeType === 1 ? t : t.parentElement;
}
function fire(attr, ev){
  var t = elOf(ev);
  if(!t) return;
  var el = t.closest('[' + attr + ']');
  if(!el) return;
  var fn = HANDLERS[el.getAttribute(attr)];
  if(fn) fn(ev);
}

function wireEvents(root){
  root.addEventListener('click', function(ev){
    var t = elOf(ev);
    /* A press that started on a drag handle is owned by the pointer
       handler, which already decided between "tap to select" and "drag". */
    if(t && t.closest('[data-pd]')) return;
    fire('data-c', ev);
  });
  root.addEventListener('change', function(ev){ fire('data-ch', ev); });
  root.addEventListener('input',  function(ev){ fire('data-in', ev); });
  root.addEventListener('pointerdown', function(ev){ fire('data-pd', ev); });

  document.addEventListener('keydown', function(ev){
    if(ev.key !== 'Escape') return;
    if(App.state.modal){ up({modal:null}); return; }
    if(App.state.sheet){ up({sheet:null, sheetMore:false}); return; }
    if(App.state.sel){ up({sel:null}); }
  });
}

/* ============================================================
   BOOT
   ============================================================ */

function start(){
  App.embFall = embeddedText('csv-fall-2026');
  App.embSpring = embeddedText('csv-spring-2026');
  App.embHash = csvHash(App.embFall);

  var cached = loadCache();
  try{
    buildAll(cached || App.embFall, App.embSpring);
    App.statSource = cached ? 'Saved update on this device' : 'Built-in snapshot';
  }catch(err){
    /* A corrupt cached update must never take the app down. */
    clearCache();
    buildAll(App.embFall, App.embSpring);
    App.statSource = 'Built-in snapshot';
  }

  try{
    App.state = boot();
  }catch(err){
    /* Corrupt or incompatible saved data: start clean rather than dying. */
    try{ localStorage.removeItem(LS); }catch(e2){}
    App.state = boot();
  }

  var root = document.getElementById('app');
  wireEvents(root);

  var lastWide = wide();
  var rz;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){
      var w = wide();
      if(w !== lastWide){ lastWide = w; render(); }
    }, 120);
  });
  window.addEventListener('orientationchange', function(){ setTimeout(render, 250); });

  render();
  if(App.sheetUpdated){
    /* Write the new stamp straight away. Without this the migration would run
       again on every load until the coach happened to change something. */
    persist();
    say('Loaded the updated roster and game sheet — notes, ratings and eligibility were kept');
  } else if(App.rosterAdded.length){
    /* Saved once, so the notice shows on the first load only. */
    persist();
    say(App.rosterAdded.map(short).join(', ') + ' joined the roster — added to availability and the batting order');
  }
  refreshFallStats();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){
  try{ start(); }catch(err){ fail(err); }
});
else {
  try{ start(); }catch(err){ fail(err); }
}

})();
</script>
